
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>zidane landing page</title>
        <link rel="stylesheet" href="style.css">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>


    <body>
        <header>
            <nav>
                <div class="logo">
                </div>

                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </header>


        <!-- Main Content -->
        <main>
            <section id="home" class="hero">
                <div class="hero-content">
                    <p class="subtitle" id="profile-title">Loading...</p>

                    <h1>
                        Hello, I'm
                        <span id="profile-name">Loading...</span>
                    </h1>

                    <p class="description" id="profile-description">
                        Loading...
                    </p>

                </div>

                <div class="hero-image">
                    <img src="images/aset1.png" alt="Zidane Putra Sriyono Foto">
                </div>
            </section>


            <!-- Skills Section -->
            <section id="skills" class="skills">

                <h2>My Skills</h2>

                <div class="skills-container">

                    <div class="skill-item">
                        <img src="images/CISCOLOGO.jpg" alt="Cisco Logo">
                    </div>

                    <div class="skill-item">
                        <img src="images/JUNIPERLOGO.jpg" alt="Juniper Networks Logo">
                    </div>

                    <div class="skill-item">
                        <img src="images/JAVASCRIPTLOGO.jpg" alt="JavaScript Logo">
                    </div>

                    <div class="skill-item">
                        <img src="images/PYTHON LOGO.jpg" alt="Python Logo">
                    </div>

                </div>

            </section>


            <section id="contact" class="contact">
                <div class="contact-information">
                    <h2>Contact Me</h2>

                    <div class="contact-details">
                        <p>Email: zputra210@gmail.com</p>
                        <p>Location: Indonesia</p>
                    </div>

                    <div class="social-links">
                        <a href="#" target="_blank">
                            <i class="bi bi-github"></i>
                        </a>
                        <a href="#" target="_blank">
                            <i class="bi bi-linkedin"></i>
                        </a>
                        <a href="#" target="_blank">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </div>

                </div>

                <div class="contact-form">
                    <form id="contact-form">
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Your Name" required>

                            <input type="email" name="email" placeholder="Your Email" required>
                        </div>

                        <textarea
                            name="message" placeholder="Your Message" required>
                        </textarea>

                        <button type="submit">
                            Send Message
                        </button>        
                    </form>
                    <p id="contact-status"></p>


                </div>

            </section>

        </main>


        <footer>
            <p>
                &copy; 2026 Zidane Putra Sriyono all rights reserved.
            </p>
        </footer>


    
        <script src="script.js"></script>

    </body>
</html>
